# Use example from https://lefthook.dev/
pre-commit:
  parallel: true
  commands:
    scoped-css:
      glob: "assets/css/components/*.css"
      run: python3 scripts/check-scoped-css.py {staged_files}
    format:
      glob: "*.{js,mjs,json,yaml,yml,css}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
