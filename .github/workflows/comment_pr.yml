name: PR Comment Workflow
on:
  workflow_dispatch:
  pull_request_target:
    types: [opened]
    branches: [beta]
jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Comment coolify preview URL.
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            // previews: <PR>.beta.monerodevs.org for monero-project/monero-site,
            // n<PR>.beta.monerodevs.org for forks that deploy their own
            const host = context.repo.owner === 'monero-project' ? `${context.issue.number}` : `n${context.issue.number}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `|What|Link|\n|:---:|---|\n|🕵️‍♂️ Review|[Files changed](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}/files)|\n|🌐 Deploy|[Preview #${context.issue.number}](https://${host}.beta.monerodevs.org)|`
            })
