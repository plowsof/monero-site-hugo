name: PR Comment Workflow
# On a pull request: comment the link to its Coolify preview, then wait for it:
# once the preview serves this push's commit (the preview banner on every page
# links it), the comment says it is live; after 15 minutes without, that it
# isn't. One comment per PR, edited on every push; a newer push cancels the wait
# for the older one. Merged or closed, the comment says the preview is offline.
# Checks out nothing and runs none of the PR's code (it only fetches the
# preview), so pull_request_target (which may comment on PRs from forks) is safe.
# Previews: https://<PR>.beta.monerodevs.org for monero-project/monero-site,
# https://n<PR>.beta.monerodevs.org for forks that deploy their own.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    branches: [beta]
  workflow_dispatch: # post or refresh the comment of an open PR by hand
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  pull-requests: write

concurrency: # a new push: stop waiting for the old one
  group: preview-comment-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  comment-on-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comment the preview's link and status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          [[ $PR =~ ^[0-9]+$ ]] || { echo "error: not a PR number: $PR" >&2; exit 1; }
          [[ $SHA ]] || SHA=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "error: not a commit: $SHA" >&2; exit 1; }
          host=$PR
          [[ $GITHUB_REPOSITORY_OWNER == monero-project ]] || host=n$PR
          url=https://$host.beta.monerodevs.org
          api=repos/$GITHUB_REPOSITORY/issues
          # body STATUS [offline]: offline, the preview without its link
          body() {
              local preview="[Preview #$PR]($url)"
              [[ ${2:-} ]] && preview="Preview #$PR"
              printf '<!-- preview -->\n|What|Link|\n|:---:|---|\n|🕵️‍♂️ Review|[Files changed](https://github.com/%s/pull/%s/files)|\n|🌐 Deploy|%s %s|\n' \
                  "$GITHUB_REPOSITORY" "$PR" "$preview" "$1"
          }
          say() { gh api -X PATCH "$api/comments/$id" -f body="$(body "$@")" > /dev/null; }
          # the comment: this bot's, found by its first line (which GitHub doesn't
          # show), or the table this workflow posted before it had that line
          id=$(gh api --paginate "$api/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]")
              | select(.body | startswith("<!-- preview -->") or startswith("|What|Link|")) | .id' | tail -n 1)
          # merged or closed: the preview is gone
          if [[ $ACTION == closed ]]; then
              [[ $id ]] || exit 0
              say "⚫ offline: the pull request was $([[ $MERGED == true ]] && echo merged || echo closed)" offline
              exit 0
          fi
          if [[ $id ]]; then say "🟡 building \`${SHA::7}\`…"
          else id=$(gh api "$api/$PR/comments" -f body="$(body "🟡 building \`${SHA::7}\`…")" --jq .id); fi
          # live: the preview answers, and its banner links this commit
          end=$((SECONDS + 15 * 60))
          until curl -fsS --max-time 20 "$url/" 2> /dev/null | grep -q "/changes/$SHA\""; do
              if ((SECONDS >= end)); then
                  say "🔴 not live after 15 minutes (\`${SHA::7}\`): see Coolify"
                  exit 0
              fi
              sleep 20
          done
          say "🟢 live (\`${SHA::7}\`)"
