name: CI

on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]

permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  YAMLFMT_VERSION: "0.21.0"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Check unescaped HTML
        # safeHTML & co. switch off escaping. They are allowed only for tag
        # wrappers (printf "<%s...") and in the reviewed helpers/render hooks
        # below; translation strings go through helpers/markdown, which sanitizes.
        run: |
          if grep -rnE 'safe(HTML|HTMLAttr|JS|CSS|URL)\b' layouts \
            | grep -vE '^layouts/(_partials/helpers/(attrs|markdown|moneropedia-content)\.html|_markup/render-(link|image)\.html|all\.enredirect\.html):' \
            | grep -vE 'printf "</?%s(%s)?>"' \
            | grep -vE 'htmlEscape'; then
            echo "Error: unescaped output outside the reviewed places (see above)"
            exit 1
          fi
          echo "All unescaped output is in reviewed places"

      - name: Check component styles are scoped
        run: python3 scripts/check-scoped-css.py

      - name: Check CSS formatting
        run: python3 scripts/check-css-format.py

      - name: Check YAML formatting
        run: |
          base="https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}"
          tarball="yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz"
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c
          tar -xzf "$tarball" yamlfmt
          ./yamlfmt -lint

      - name: Check JSON files are valid and formatted
        # translations are left to Weblate; everything else is kept in jq's format
        run: |
          status=0
          for f in $(git ls-files '*.json' ':!src/i18n/translations/**'); do
            if ! jq . "$f" | diff -q - "$f" > /dev/null; then
              echo "::error file=$f::not valid JSON or not formatted (fix with: jq . $f > tmp && mv tmp $f)"
              status=1
            fi
          done
          for f in $(git ls-files 'src/i18n/translations/**/*.json'); do
            jq empty "$f" || { echo "::error file=$f::not valid JSON"; status=1; }
          done
          exit $status

  css-lint:
    name: Lint CSS (Stylelint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Stylelint with stylelint-config-standard, as on the Astro site, run from
      # Super-Linter's container (no Node.js in this repository). The rules are
      # in .github/linters/.stylelintrc.json; to run it locally, see
      # docs/how-to-style-your-page-contents.md.
      - name: Stylelint
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_CSS: true
          CSS_FILE_NAME: .stylelintrc.json
          FILTER_REGEX_INCLUDE: assets/css/.*
          # a Hugo template, not plain CSS
          FILTER_REGEX_EXCLUDE: assets/css/base/fonts.css
          MULTI_STATUS: false

  build:
    name: Build & Validate
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $tarball\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c
          tar -xzf "$tarball" hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('src/assets/**', 'src/content/**/*.png', 'src/content/**/*.jpg', 'src/content/**/*.svg', 'assets/images/**', 'assets/fonts/**') }}
          restore-keys: hugo-gen-${{ env.HUGO_VERSION }}-

      - name: Build site
        run: hugo --gc

      - name: Check the site has no JavaScript
        run: python3 scripts/check-no-js.py dist
